name: ci

on:
  push:
  pull_request:

# The checks need to read the code and nothing else: no token rights, no secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tools
        run: pacman -Syu --noconfirm python python-gobject libadwaita gtk4 shellcheck lua git
      - name: Static checks
        run: scripts/check.sh
      - name: Docs links
        run: python3 scripts/check-docs.py
      - name: Hyprland config (best effort)
        continue-on-error: true
        run: |
          pacman -S --noconfirm hyprland
          scripts/check.sh
