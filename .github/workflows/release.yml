name: release

# A release is cut by hand: Actions > release > Run workflow. Nothing here runs on a push.
# The default is a dry run: it prints the next version and its notes and creates nothing.
# A real run creates the tag vX.Y.Z, the GitHub release and one commit that adds the notes to CHANGELOG.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show the next version and the notes, create nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag, the release and the changelog commit
      actions: read   # to see that ci passed for this commit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ci must have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          # The changelog commit of the last release is pushed with the workflow token, which does not start ci: judge the commit before it.
          case "$(git log -1 --format=%s)" in "chore(release): "*) sha=$(git rev-parse HEAD~1) ;; esac
          passed=$(gh run list --workflow ci.yml --commit "$sha" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [ "$passed" -gt 0 ] || { echo "No passing ci run for $sha. Fix main first." >&2; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the release tools (versions pinned by the lockfile, no install scripts)
        run: |
          cp .github/release/package.json .github/release/package-lock.json .
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The changelog commit is the owner's own: same name and noreply address as every other commit, no bot account.
          # Never put the owner login in these: semantic-release masks the value of any variable whose name contains
          # "auth", in the notes too, so every repository link would read github.com/[secure]/primo.
          GIT_AUTHOR_NAME: sya
          GIT_AUTHOR_EMAIL: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
          GIT_COMMITTER_NAME: sya
          GIT_COMMITTER_EMAIL: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            npx --no-install semantic-release --dry-run
          else
            npx --no-install semantic-release
          fi
