# Catppuccin Mocha. Colours are hex without '#'.
name=Catppuccin Mocha

# dark | light: used by `hypr-theme dark|light|toggle`
mode=dark

base=1e1e2e
mantle=181825
crust=11111b
surface0=313244
surface1=45475a
overlay=6c7086
text=cdd6f4
subtext=bac2de

shadow=11111b

accent=89b4fa
accent2=cba6f7
red=f38ba8
orange=fab387
yellow=f9e2af
green=a6e3a1
cyan=89dceb
blue=89b4fa
magenta=cba6f7

# Typography
font_sans=Inter
font_mono=JetBrainsMono Nerd Font
font_icon=JetBrainsMono Nerd Font

# Shape
gaps_in=4
gaps_out=8
border_size=2
rounding=12
blur_size=6
blur_passes=2

# Shape of bar islands / OSD (999 = pill) and of the lockscreen password field (-1 = pill)
bar_radius=999
input_rounding=-1

# Lockscreen tint over the blurred screenshot: hex alpha 00-ff
lock_tint=a6
lock_brightness=0.6

# Optional: path to a wallpaper. Relative paths are resolved from this folder.
# Falls back to ~/Pictures/wallpaper.jpg when unset or missing.
wallpaper=wallpaper.png
