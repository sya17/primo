# Primo Dusk: warm indigo night, periwinkle accent with a coral spark. Colours are hex without '#'.
name=Primo Dusk

# dark | light: used by `hypr-theme dark|light|toggle`
mode=dark

base=171826
mantle=121320
crust=0d0e18
surface0=232539
surface1=303350
overlay=5d6186
text=e7e9f6
subtext=aeb3d3

shadow=06070d

accent=8da2ff
accent2=ff9e7d
red=ff6b81
orange=ffaa66
yellow=f6d479
green=7fd6a0
cyan=6fd3e8
blue=8da2ff
magenta=c58bff

font_sans=Inter
font_mono=JetBrainsMono Nerd Font
font_icon=JetBrainsMono Nerd Font

# Compact and crisp
gaps_in=3
gaps_out=6
border_size=2
rounding=9
blur_size=5
blur_passes=2

# Shape of bar islands / OSD (999 = pill) and of the lockscreen password field (-1 = pill)
bar_radius=10
input_rounding=9

# Lockscreen tint over the blurred screenshot: hex alpha 00-ff
lock_tint=a6
lock_brightness=0.6

wallpaper=wallpaper.png
# gradient | lines (used by scripts/gen-wallpaper.py)
wallpaper_style=lines
