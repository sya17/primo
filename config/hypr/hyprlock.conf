# Colours and font come from hyprlock-theme.conf (generated by scripts/theme-switch).
source = ~/.config/hypr/hyprlock-theme.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = $lock_brightness
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 20
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    rounding = -1
    inner_color = $surface
    outer_color = $accent
    font_color = $text
    check_color = $yellow
    fail_color = $red
    fade_on_empty = true
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}
