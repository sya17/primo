# Colours, font and dimming come from hyprlock-theme.conf (generated by scripts/theme-switch).
source = ~/.config/hypr/hyprlock-theme.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Soft fade in/out and a springy password field.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldWidth, 1, 4, easeOutQuint
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.015
    contrast = 0.95
    vibrancy = 0.2
    vibrancy_darkness = 0.2
    brightness = $lock_brightness
}

# Tint in the theme colour keeps the text readable on any wallpaper (strong on light themes)
shape {
    monitor =
    size = 100%, 100%
    color = $tint
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $subtext
    font_size = 17
    font_family = $font Medium
    position = 0, 215
    halign = center
    valign = center
}

# Time: large and light, like the iOS lock screen
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 118
    font_family = $font Thin
    position = 0, 120
    halign = center
    valign = center
}

# Password pill
input-field {
    monitor =
    size = 270, 46
    outline_thickness = 2
    rounding = $input_rounding
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $accent2
    fail_color = $red
    capslock_color = $yellow
    fade_on_empty = false
    fade_timeout = 1500
    placeholder_text = <span foreground="##ffffff88">Enter password</span>
    fail_text = <i>$FAIL</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# Primo mark, small at the bottom edge (rendered in the theme's colours by theme-switch)
image {
    monitor =
    path = ~/.config/hypr/logo.svg
    size = 32
    rounding = 0
    border_size = 0
    position = 0, 36
    halign = center
    valign = bottom
}

# Small hint under the field
label {
    monitor =
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1 | sed 's/.*/&% · /')$USER"
    color = $subtext
    font_size = 13
    font_family = $font Medium
    position = 0, -75
    halign = center
    valign = center
}
